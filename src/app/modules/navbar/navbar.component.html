<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-toggle auto-hide="false">
        <ion-button>
          <ion-icon slot="icon-only" name="menu"></ion-icon>
        </ion-button>
      </ion-menu-toggle>
    </ion-buttons>
    <ion-title>DSL Training</ion-title>
    @if (isLoggedIn) {

      <ion-buttons slot="end">

        <p class="ion-text-wrap ion-margin-end">Welcome, User ID:{{ userID }} / Profile ID:{{profileID}}</p>

        <ion-button (click)="logout()" color="light" fill="outline">
          <ion-icon name="log-out" slot="end" size="large"></ion-icon>
          <ion-label>Log out</ion-label>
        </ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>

<ion-menu side="start" contentId="main-content">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item>
        <ion-label><strong>User ID:{{ userID }} / Profile ID:{{profileID}}</strong></ion-label>
      </ion-item>
      <ion-menu-toggle auto-hide="false">
        <ion-item button (click)="navigateTo('/home')">
          <ion-icon name="home" slot="start"></ion-icon>
          <ion-label>Ana Sayfa</ion-label>
        </ion-item>
        <ion-item button (click)="navigateTo('/training-list')">
          <ion-icon name="settings" slot="start"></ion-icon>
          <ion-label>Antrenmanlar</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-list>
  </ion-content>
</ion-menu>
