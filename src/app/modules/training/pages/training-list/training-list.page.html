<ion-content [fullscreen]="true">
  <div id="container" class="ion-padding">
    @if (loading) {
      <div class="ion-text-center ion-padding">
        <ion-spinner name="crescent"></ion-spinner>
      </div>
    } @else if (error) {
      <ion-text color="danger" class="ion-padding">
        {{ error }}
      </ion-text>
    } @else {
      <div><br></div>
      <div><br></div>
      <div><h1>Antrenman Listesi</h1></div>
      <div class="ion-margin-bottom">
        <label for="trainingType">Tür</label>
        <select id="trainingType" [(ngModel)]="selectedTrainingType" (ngModelChange)="applyFilters()">
          <option value="">Tümü</option>
          @for (type of trainingTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>

        <label for="trainingStatus">Durum</label>
        <select id="trainingStatus" [(ngModel)]="selectedTrainingStatus" (ngModelChange)="applyFilters()">
          <option value="">Tümü</option>
          @for (status of trainingStatuses; track status) {
            <option [value]="status">{{ status }}</option>
          }
        </select>

        <label for="trainingDate">Tarih</label>
        <input id="trainingDate" type="date" [(ngModel)]="selectedDate" (ngModelChange)="applyFilters()" />

        <ion-button size="small" fill="clear" (click)="resetFilters()">Temizle</ion-button>
      </div>

      @if (trainingList.length > 0) {
      <ion-grid>
        <!-- Header -->
        <ion-row class="table-header">
          <ion-col><strong>Durum</strong></ion-col>
          <ion-col><strong>Tür</strong></ion-col>
          <ion-col><strong>Detay</strong></ion-col>
        </ion-row>

        <!-- Rows -->
        @for (training of trainingList; track training._id) {
          <ion-row>
            <ion-col>
              <ion-badge [style.--background]="getStatusColor(training.trainingStatus)">
                {{ training.trainingStatus }}
              </ion-badge>
            </ion-col>

            <ion-col>
              {{ training.trainingType }}
            </ion-col>

            <ion-col>
              <ion-button size="small" (click)="goToTrainingDetail(training._id)">
                Detay
              </ion-button>
            </ion-col>
          </ion-row>
        }
      </ion-grid>
      } @else {
        <ion-text class="ion-padding">
          Henüz antrenman yok.
        </ion-text>
      }
    }
  </div>
</ion-content>
